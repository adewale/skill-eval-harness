name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish distribution to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")
          PY

      # A release tag may name a commit CI never ran, so the release repeats
      # every gate a pull request runs, with the linters the test extra pins.
      - name: Install package and dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile Python files
        run: python -m py_compile *.py scripts/*.py examples/adewale-workspace/*.py examples/demo-skill/*.py type_tests/*.py tests/*.py

      - name: Run Ruff
        run: ruff check .

      - name: Run ty
        run: ty check --error-on-warning --output-format github

      - name: Run the test suite on the release tag
        run: python -m unittest discover tests -v

      - name: Check pytest/unittest collection parity
        run: python scripts/check_test_collection_parity.py

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Smoke installed wheel
        run: |
          python -m venv /tmp/skill-eval-wheel-smoke
          /tmp/skill-eval-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/skill-eval-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/skill-eval-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata
          import tomllib
          from pathlib import Path
          expected = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          actual = importlib.metadata.version("skill-eval-harness")
          assert actual == expected, f"installed version {actual!r} != pyproject {expected!r}"
          PY
          /tmp/skill-eval-wheel-smoke/bin/skill-benchmark --help
          /tmp/skill-eval-wheel-smoke/bin/skill-pi-trigger-eval --help
          /tmp/skill-eval-wheel-smoke/bin/skill-trigger-matrix --help

      - name: Import every module from the built wheel
        run: python scripts/check_installed_wheel.py --wheel dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
