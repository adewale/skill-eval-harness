name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile Python files
        run: python -m py_compile *.py scripts/*.py examples/adewale-workspace/*.py examples/demo-skill/*.py type_tests/*.py tests/*.py

      - name: Run Ruff
        run: ruff check .

      - name: Run ty
        run: ty check --error-on-warning --output-format github

      - name: Verify property tests are collected
        run: python -m pytest --collect-only -q tests/test_telemetry_properties.py

      - name: Run tests
        run: python -m pytest tests -v

      - name: Check CLI entrypoints
        run: |
          python skill_benchmark.py --help
          python run_pi_trigger_eval.py --help
          python run_trigger_matrix.py --help

  windows-text-contracts:
    name: Windows Python 3.12 text contracts
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install package and dependencies
        run: python -m pip install -e ".[test]"

      - name: Run ty
        run: ty check --error-on-warning --output-format github

      - name: Run text-contract tests
        run: python -m unittest discover -s tests -p "test_text_contracts.py" -v

      - name: Run Jetty journal durability tests
        run: python -m unittest discover -s tests -p "test_jetty_attempt_journal.py" -v

      - name: Check installed CLI
        run: skill-benchmark --help
