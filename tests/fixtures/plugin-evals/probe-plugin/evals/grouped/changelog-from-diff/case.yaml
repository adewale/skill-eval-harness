schema_version: "1.1"
name: changelog-from-diff
description: Turn a diff into a changelog entry and a commit message.
tags: [smoke, files]
expected_outcome: A CHANGELOG.md entry under Unreleased plus a conventional commit line.
runs: 2
context:
  scaffold_script: fixture.sh
  add_dirs: [resources]
execution:
  max_turns: 12
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Skill, Write]
graders:
  - name: mentions-rename
    type: llm
    weight: 2
    criteria: |
      PASS if the reply names the getUser -> fetchUser rename.
      FAIL if the rename is missing or described as a new feature.
  - name: read-before-skill
    type: tool_order
    before: Read
    after: { tool: Skill, input_match: tidy-commit }
